<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alberto Migliorato — AI Engineer & Senior SWE</title>
    <meta name="description" content="Alberto Migliorato — AI Engineer & Senior Software Engineer. LLM training, distributed systems, and open-source developer tooling." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="preload" as="image" href="/shots/pastis/produzione.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" href="/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <!--
      Static snapshot of src/sections/Hero.tsx (content from src/content.ts), so the hero text and
      LCP image paint straight from HTML instead of waiting on the JS bundle to parse, execute and
      mount React (P3-R13/F5). createRoot().render() replaces this whole subtree on mount; the
      markup below is kept byte-for-byte in sync with the component so there's no visible flash.
      tests/index-html.test.ts guards this against drifting from src/content.ts.
    -->
    <div id="root">
      <section id="hero" class="hero">
        <div class="rail hero__grid">
          <div class="hero__text">
            <h1 class="hero__name">Alberto Migliorato</h1>
            <p class="hero__title">AI Engineer &amp; Senior SWE</p>
            <p class="hero__sub">From Java plugins and distributed systems to fine-tuning LLMs in production.</p>
            <div class="hero__cta">
              <a class="btn btn--primary" href="https://github.com/albemiglio" target="_blank" rel="noopener">GitHub</a>
              <a class="btn btn--ghost" href="https://linkedin.com/in/albertomigliorato" target="_blank" rel="noopener">LinkedIn</a>
              <a class="btn btn--ghost" href="mailto:dev@albemiglio.it">Email</a>
            </div>
          </div>
          <div class="hero__stage">
            <div class="hero__sculpture" aria-hidden="true">
              <!-- The offsets are cropStyle(HERO_SCREENS[0]) in src/heroScreens.ts. -->
              <div class="hero__still">
                <img src="/shots/pastis/produzione.webp" alt="" loading="eager" fetchpriority="high" decoding="async" width="1512" height="982" style="width: 229.89%; left: -40.23%; top: -58.18%;" />
              </div>
            </div>
            <p class="hero__caption">pastis &middot; today&rsquo;s production</p>
          </div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
